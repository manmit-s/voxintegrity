<style>
        .glass-panel {
            background-color: rgba(18, 33, 49, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .input-field {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease-in-out;
        }
        
        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px #3b82f6;
            outline: none;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: #ffffff;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }
        
        .bg-gradient-radial {
            background: radial-gradient(circle at center, #122131 0%, #051424 100%);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center font-body-md bg-gradient-radial">
<main class="w-full max-w-md px-container-margin md:px-0">
<div class="glass-panel rounded-xl p-stack-lg shadow-[0_20px_40px_rgba(0,0,0,0.5)]">
<div class="flex flex-col items-center mb-stack-lg">
<div class="w-16 h-16 rounded-full bg-surface-container-highest border border-white/10 flex items-center justify-center mb-stack-md shadow-inner">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1; font-size: 32px;">shield</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Vaani-Kavach</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-stack-sm text-center">Authentication required for secure access.</p>
</div>
<form action="#" class="space-y-stack-md" method="POST">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit uppercase" for="email">EMAIL</label>
<input class="input-field w-full rounded font-code-md text-code-md text-on-surface px-4 py-3 placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="analyst@enterprise.com" required="" type="email">
</div>
<div>
<div class="flex justify-between items-center mb-unit">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-secondary-fixed transition-colors" href="#">Forgot?</a>
</div>
<input class="input-field w-full rounded font-code-md text-code-md text-on-surface px-4 py-3 placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••••••" required="" type="password">
</div>
<button class="btn-primary w-full rounded py-3 font-body-md text-body-md font-semibold mt-stack-sm flex items-center justify-center gap-2" type="submit">
                    Sign in securely
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<div class="mt-stack-lg flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-sm">lock</span>
<span class="font-body-sm text-body-sm">Enterprise protected connection</span>
</div>
</div>
</main>




</body></html>
